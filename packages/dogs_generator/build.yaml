targets:
  $default:
    builders: {}

builders:
  dogs_linking:
    import: "package:dogs_generator/integrations.dart"
    builder_factories: [ "dogsLinking" ]
    build_extensions: { ".dart": [ ".link.dogs" ] }
    runs_before: [ "dogs_generator:dogs_reactor" ]
    auto_apply: root_package
    build_to: cache
  dogs_bindings:
    import: "package:dogs_generator/integrations.dart"
    builder_factories: [ "dogsBindings" ]
    build_extensions: { ".dart": [ ".conv.dogs" ] }
    runs_before: [ "dogs_generator:dogs_reactor" ]
    auto_apply: root_package
    build_to: cache
  dogs_descriptors:
    import: "package:dogs_generator/integrations.dart"
    builder_factories: [ "dogsConverters" ]
    # MUST match DogsOutputLayout.converterBuildExtensions for
    # directory=generated/dogs + flat=true (the package default).
    # If these drift, build_runner skips converters and dogs.g.dart can go empty.
    build_extensions:
      "^lib/{{s0}}.dart": ["lib/generated/dogs/{{s0}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}/{{s3}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}_{{s3}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}/{{s3}}/{{s4}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}_{{s3}}_{{s4}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}/{{s3}}/{{s4}}/{{s5}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}_{{s3}}_{{s4}}_{{s5}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}/{{s3}}/{{s4}}/{{s5}}/{{s6}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}_{{s3}}_{{s4}}_{{s5}}_{{s6}}.conv.g.dart"]
      "^lib/{{s0}}/{{s1}}/{{s2}}/{{s3}}/{{s4}}/{{s5}}/{{s6}}/{{s7}}.dart": ["lib/generated/dogs/{{s0}}_{{s1}}_{{s2}}_{{s3}}_{{s4}}_{{s5}}_{{s6}}_{{s7}}.conv.g.dart"]
    auto_apply: root_package
    build_to: source
  dogs_reactor:
    import: "package:dogs_generator/integrations.dart"
    builder_factories: [ "dogsReactor" ]
    build_extensions:
      "$lib$":
        - "generated/dogs/dogs.g.dart"
    required_inputs: [".dogs", ".conv.g.dart"]
    auto_apply: root_package
    build_to: source
